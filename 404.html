<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: #04060f; color: #f3f6fc; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 440px; }
    .code { font-size: clamp(72px, 18vw, 120px); font-weight: 800; line-height: 1; margin: 0; letter-spacing: -2px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #9aa6be; line-height: 1.6; margin: 0 0 28px; }
    a { display: inline-block; padding: 12px 22px; border: 1px solid #2d5bff; border-radius: 6px;
        color: #f3f6fc; text-decoration: none; font-weight: 600; }
    a:hover, a:focus-visible { background: #2d5bff; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Questa pagina non esiste</h1>
